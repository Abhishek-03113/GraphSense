[project]
name = "dodgeai-backend"
version = "0.1.0"
description = "FastAPI backend for DodgeAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.29",
    "pgvector>=0.2.5",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "greenlet>=3.3.2",
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "click>=8.1",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
graphsense = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL server (set TEST_DATABASE_DSN)"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]
