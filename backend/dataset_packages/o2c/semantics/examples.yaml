  sql: |
    SELECT bp.customer, bp.business_partner_full_name
    FROM business_partners bp
    WHERE EXISTS (SELECT 1 FROM sales_order_headers soh WHERE soh.sold_to_party = bp.customer)
    AND NOT EXISTS (SELECT 1 FROM billing_document_headers bdh WHERE bdh.sold_to_party = bp.customer)
  expect: {min_rows: 1, columns_include: [customer, business_partner_full_name]}

