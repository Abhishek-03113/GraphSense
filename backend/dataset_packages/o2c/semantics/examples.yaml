# Chain order -> delivery -> invoice, then the cancelled flag (80 orders).
- id: golden_orders_with_cancelled_invoices
  role: golden
  question: How many sales orders ended up with an invoice that was later cancelled?
  tags: [flow, sales-order, billing, cancellation, counts]
  sql: |
    SELECT COUNT(DISTINCT soh.sales_order) AS orders_with_cancelled_invoice
    FROM sales_order_headers soh
    JOIN outbound_delivery_items odi ON odi.reference_sd_document = soh.sales_order
    JOIN billing_document_items bdi
        ON bdi.reference_sd_document = odi.delivery_document
        AND bdi.reference_sd_document_item = odi.delivery_document_item
    JOIN billing_document_headers bdh ON bdh.billing_document = bdi.billing_document
    WHERE bdh.billing_document_type = 'F2' AND bdh.billing_document_is_cancelled = TRUE
  expect: {min_rows: 1, max_rows: 1, columns_include: [orders_with_cancelled_invoice]}
