# The chain invoice line -> delivery line -> sales order (163 distinct pairs, cancellations included).
- id: golden_invoice_source_orders
  role: golden
  question: Which sales order does each billing document trace back to?
  tags: [flow, billing, sales-order]
  sql: |
    SELECT DISTINCT bdi.billing_document, odi.reference_sd_document AS sales_order
    FROM billing_document_items bdi
    JOIN outbound_delivery_items odi
        ON odi.delivery_document = bdi.reference_sd_document
        AND odi.delivery_document_item = bdi.reference_sd_document_item
  expect: {min_rows: 1, columns_include: [billing_document, sales_order]}

