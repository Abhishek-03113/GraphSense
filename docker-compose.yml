services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dodgeai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dodgeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First start only: pgvector and the graphsense_app / graphsense_ro roles.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
